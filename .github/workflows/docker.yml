name: docker
# Builds the live app (Dockerfile in the repo root) and publishes it to GitHub Packages:
#   docker run -p 7860:7860 -e MODEL_API_KEY=... ghcr.io/giochvanno/isochron-ai
# Runs when a release is published, or by hand (Actions -> docker -> Run workflow).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/giochvanno/isochron-ai
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Isochron AI
            org.opencontainers.image.description=A phone video becomes a physics measurement (Muse Spark + SAM 3.1)
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test, demo mode without a key
        run: |
          docker run -d --name app -p 7860:7860 ghcr.io/giochvanno/isochron-ai:latest
          for i in $(seq 1 30); do curl -sf localhost:7860/healthz && break; sleep 2; done
          curl -sf localhost:7860/api/status | grep '"live":false'
          curl -sf localhost:7860/api/replay | grep -q '"frames"'
          docker logs app | tail -20
