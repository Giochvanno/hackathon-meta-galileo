name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (no network, no API key)
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          python -m galileo.cli --help
          python -m galileo.cli lab --help
          python -m galileo.cli agent --help
      - name: Secret scan
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo ".env is committed"; exit 1; fi
          if git grep -n -E 'MODEL_API_KEY=[A-Za-z0-9_-]{12,}|ghp_[A-Za-z0-9_]{20,}|-----BEGIN .*PRIVATE KEY-----' -- . ':!.github'; then
            echo "secret-like string found"; exit 1
          fi
